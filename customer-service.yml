server:
  port: 8081

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/customerdb

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    com.bank.customer: DEBUG
    org.springframework.data.mongodb.core.ReactiveMongoTemplate: INFO