server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service-root
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**
