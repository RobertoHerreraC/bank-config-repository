eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoint:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted
    health:
      access: unrestricted