server:
  port: 8084

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/creditcarddb

customer-service:
  base-url: http://localhost:8081

movement-service:
  base-url: http://localhost:8085

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    com.bank.creditcard: DEBUG